<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#171310" fill="none" stroke-linecap="round">
    <!-- 外周の輪 -->
    <circle cx="50" cy="50" r="43" stroke-width="8.5"/>
    <!-- 半濁点の丸（右上） -->
    <circle cx="66.5" cy="27.5" r="6.8" stroke-width="5.5"/>
    <!-- 右画・縦棒（上端は輪と一体化） -->
    <path stroke-width="9.5" d="M 55.5 11 C 60 24, 61.5 40, 59.5 53 C 58.8 58, 57.6 61, 56 63.5"/>
    <!-- 右画・下の輪 -->
    <path stroke-width="6.5" d="M 56 59.5 C 47.5 57.5, 40.5 62.5, 41.5 70.5 C 42.5 79, 52 84, 61.5 80.5 C 71 77, 74.5 67, 68.5 61.5 C 65 58.4, 60 58.6, 56 59.5"/>
    <!-- 左画・頭のカール -->
    <path stroke-width="5" d="M 44.5 24 C 40 16.5, 28 16.5, 26 24.5 C 24 31, 29 36, 34 33.5"/>
    <path stroke-width="2.8" d="M 34 33.5 C 36 32.7, 37.3 31.2, 38 29.5"/>
    <!-- 左画・胴体 -->
    <path stroke-width="10" d="M 43 26 C 39.5 36, 36.8 48, 36.3 58 C 36 63.5, 36.6 68, 38 71.5"/>
    <!-- 左画・足元の払い（先細り、輪の穴に入らない） -->
