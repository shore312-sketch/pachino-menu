<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#171310" fill="none" stroke-linecap="round">
    <!-- 外周の輪 -->
    <circle cx="50" cy="50" r="43" stroke-width="7.5"/>
    <!-- 半濁点の丸（2時、輪のすぐ内側） -->
    <circle cx="69.5" cy="30" r="7.5" stroke-width="6"/>

    <!-- 左画：波頭のカール（先端は輪に軽く触れる） -->
    <path stroke-width="5.5" d="M 26.5 16 C 34 13.5, 39.5 18.5, 38.5 25.5 C 37.8 30.5, 33 33, 29.5 31"/>
    <!-- 左画：首 -->
    <path stroke-width="8" d="M 37 28 C 34.5 34.5, 32.2 41.5, 31.5 48"/>
    <path stroke-width="11" d="M 31.7 46 C 31.2 52, 31.8 57, 33.8 61"/>
    <!-- 左画：おたまじゃくしの胴と跳ね -->
    <path stroke-width="13.5" d="M 33.8 59.5 C 35.5 64.5, 39.5 66.5, 43 64.8"/>
    <path stroke-width="5.5" d="M 43 64.8 C 45.8 63.5, 47.4 61, 47.8 58"/>

    <!-- 右画：縦棒（先端は左へ小さくはねる） -->
    <path stroke-width="6" d="M 56.6 18 C 55.2 16.5, 53.4 15.8, 51.6 16.2"/>
    <path stroke-width="10.5" d="M 56.3 17.5 C 59.5 26, 60.6 38, 59 49.5 C 58.7 52, 58.2 54, 57.6 55.5"/>
    <!-- 右画：下の太いドーナツ状の輪 -->
    <ellipse cx="57" cy="66.5" rx="13.4" ry="10.4" stroke-width="9" transform="rotate(-8 57 66.5)"/>
  </g>
</svg>
