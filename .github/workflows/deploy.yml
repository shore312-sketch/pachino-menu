name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      # D1データベースが消えていても自動で作り直し、実IDをwrangler.jsoncに反映する
      - name: Ensure D1 database exists
        run: |
          set -e
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pachino-menu") | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "D1 database 'pachino-menu' not found. Creating..."
            npx wrangler d1 create pachino-menu
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pachino-menu") | .uuid')
          fi
          echo "Using D1 database id: $DB_ID"
          sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$DB_ID\"/" wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply pachino-menu --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
